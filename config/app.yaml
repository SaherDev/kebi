# Kebi — non-secret application config
# Secrets (API keys, DB/Redis URLs) live in .env (gitignored symlink)
# ADR-015: YAML config loader for non-secret settings
# ADR-016: logical-role-to-provider mapping
# ADR-029: consolidated non-secret config into app.yaml

# ---------------------------------------------------------------------------
# App metadata
# ---------------------------------------------------------------------------
app:
  name: kebi
  description: AI engine for Kebi
  api_prefix: /v1

# ---------------------------------------------------------------------------
# Model assignments — logical roles to providers and models
# ADR-016, ADR-020: code never hardcodes model names, always reads from config
# ---------------------------------------------------------------------------
providers:
  groq:
    base_url: https://api.groq.com
  ollama:
    base_url: http://localhost:11434/v1
  # Web search backing the `web_search` tool (ADR-145). Selected only when
  # BRAVE_API_KEY is set; otherwise the null provider is used.
  brave:
    base_url: https://api.search.brave.com
  # OpenAI-compatible gateway for benchmarking candidate models (ADR-173):
  # one OPENROUTER_API_KEY covers Gemini/Qwen/DeepSeek/MiniMax/etc. at
  # pass-through pricing. Production winners get a direct provider
  # integration before promotion — this path is for the bakeoff matrix
  # and short A/B windows, not the steady state.
  openrouter:
    base_url: https://openrouter.ai/api/v1

# ---------------------------------------------------------------------------
# Model profiles (ADR-176/179) — THE model catalog. Every role under
# models: references exactly one profile via `profile: <name>`; provider
# and model names never appear anywhere else. The mini-workhorse GROUP
# (harvesters, profilers, taste, memory, namer, home) moves to a new
# model by editing ONE profile here; KEBI_MODEL_<ROLE>=<profile-name>
# switches a single role for a trial (unset = rollback). Role keys
# override profile keys (max_tokens, temperature, timeouts per-role).
# ---------------------------------------------------------------------------
model_profiles:
  mini-workhorse:
    provider: openai
    model: gpt-4o-mini
    max_retries: 2
    timeout_seconds: 30
  luna-workhorse:
    provider: openai
    model: gpt-5.6-luna
    max_retries: 2
    timeout_seconds: 30
    # Required "none": Luna rejects function tools at any other effort on
    # the chat-completions API (found live in the first bakeoff).
    reasoning_effort: none
  # The strong group — roles that deliberately pay for gpt-4o (extractor,
  # area_registry, and any future role where mini measurably missed).
  gpt4o-strong:
    provider: openai
    model: gpt-4o
    max_retries: 2
    timeout_seconds: 30
  # The realtime Claude group — per-turn classification/orchestration on
  # Haiku 4.5 (location_resolver, orchestrator default). Timeouts differ
  # per role, so they stay on the role block.
  haiku-fast:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    max_retries: 2
  # Previous advanced-tier orchestrator — kept as the rollback target
  # for ADR-177's sonnet-5 selection.
  sonnet-strong:
    provider: anthropic
    model: claude-sonnet-4-6
    max_retries: 2
  # Non-chat providers — profiled for uniformity: provider+model appear
  # ONLY in this section, never inline under models:.
  whisper-transcribe:
    provider: groq
    model: whisper-large-v3-turbo
    max_retries: 2
  voyage-embed:
    provider: voyage
    model: voyage-4-lite
  # --- Benchmark candidates (ADR-175) — unused until a role's profile
  # points here or KEBI_MODEL_<ROLE>=<name> selects one for a trial. ---
  sonnet-5:
    provider: anthropic
    model: claude-sonnet-5
    max_retries: 2
    # Sonnet 5 rejects `temperature` (400 "deprecated for this model") —
    # found by the orchestrator bakeoff. Clients omit the param; the
    # role-level temperature value is ignored for this family.
    supports_temperature: false
  gpt-terra:
    provider: openai
    model: gpt-5.6-terra
    max_retries: 2
    timeout_seconds: 60
  gemini-flash:
    provider: openrouter
    model: google/gemini-3.7-flash
    max_retries: 2
    timeout_seconds: 30
  qwen-flash:
    provider: openrouter
    model: qwen/qwen3.5-flash
    max_retries: 2
    timeout_seconds: 30
  qwen-plus:
    provider: openrouter
    model: qwen/qwen3.5-plus
    max_retries: 2
    timeout_seconds: 30
  deepseek-flash:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    max_retries: 2
    timeout_seconds: 30
  minimax-m3:
    provider: openrouter
    model: minimax/minimax-m3
    max_retries: 2
    timeout_seconds: 60

models:
  # One shape for every role (ADR-179): `profile:` names the model from
  # model_profiles above; the rest is per-role params (they override the
  # profile). Switch one role: KEBI_MODEL_<ROLE>=<profile-name> in the env
  # (unset = rollback, unknown name = warn + keep configured). Move a
  # whole group: edit its shared profile once.

  # Speech-to-text for the audio track of submitted videos (e.g. TikTok/Reels).
  # Output feeds the SPEECH source in the extraction confidence pipeline.
  transcriber:
    profile: whisper-transcribe
    max_tokens: 0
    temperature: 0

  # Vision model that reads sampled video frames to pull on-screen place names,
  # signage, and OCR'd text. Feeds the OCR / vision_frames extraction sources.
  vision_frames:
    profile: mini-workhorse
    max_tokens: 512
    temperature: 0

  # Structured place extraction from free text (captions, descriptions, plain
  # text, transcribed speech). Returns the Pydantic place schema used by the
  # extraction pipeline. Luna, not gpt-4o (ADR-178): the round-1 bakeoff tied
  # them on quality (0.875 / 88% pass) at ~1/16th the cost. Rollback:
  # KEBI_MODEL_EXTRACTOR=gpt4o-strong (no deploy) or repoint this profile.
  # Watch /v1/extract latency — Luna's p95 was slower in the bakeoff.
  extractor:
    profile: luna-workhorse
    max_tokens: 512
    temperature: 0

  # Knowledge-layer writers (ADR-120/121). Both mine world-entity facts from
  # already-gathered text and emit structured claims; the harvester runs on the
  # background second pass over a saved share, the curator structures an
  # expert's prose. Cheap, off the critical path.
  knowledge_harvester:
    profile: mini-workhorse
    max_tokens: 1024
    temperature: 0
  knowledge_curator:
    profile: mini-workhorse
    max_tokens: 1024
    temperature: 0

  # Place profiler (ADR-152) — experiential tags for a thin catalog row from
  # venue identity alone, fired in the background on the place screen's first
  # open. One call per unique place ever; off the critical path.
  place_profiler:
    profile: mini-workhorse
    max_tokens: 512
    temperature: 0

  # Area profiler (ADR-153) — an area's global profile (summary, chips,
  # breadcrumb names, notable children) from its claims + geography
  # knowledge, fired in the background on the area screen's first open.
  # One call per unique area ever; off the critical path.
  area_profiler:
    profile: mini-workhorse
    max_tokens: 800
    temperature: 0

  # Geo registry colloquial layer — once per newly minted area, records what
  # people call the unit, the bigger colloquial area it belongs to, and the
  # distinct places one admin name covers (multi-island desa). Every name it
  # offers is verified against the geocoder in code before storage; identity
  # never comes from this call. The strong profile, not mini, deliberately:
  # mini missed the multi-island covers case outright in live probes, and
  # this fires once per unique area EVER — the knowledge gap costs a wrong
  # screen, the model gap costs fractions of a cent.
  area_registry:
    profile: gpt4o-strong
    max_tokens: 400
    temperature: 0

  # Mines durable area facts out of a turn's web-search findings (ADR-145).
  # Runs after the answer is already sent, so latency does not matter and
  # cheap does: same tier as the other knowledge writers.
  web_harvester:
    profile: mini-workhorse
    max_tokens: 800
    temperature: 0

  # Embedding model for semantic search over saved places (pgvector) and for
  # the FTS+vector RRF recall pipeline. 1024-dim per ADR-040.
  embedder:
    profile: voyage-embed
    dimensions: 1024

  # LangGraph agent brain — drives the recall/consult tool loop behind
  # POST /v1/chat and /v1/chat/stream (ADR-062/065). Higher temperature for
  # conversational variety.
  #
  # Haiku default (ADR-100): the orchestrator is ~69% of consult cost, and
  # Haiku stays in the function-calling-leading Claude family so the prompt
  # cache split applies. AGENT_MODEL=<profile-name> (alias for
  # KEBI_MODEL_ORCHESTRATOR) A/Bs another profile without a deploy.
  #
  # `advanced` names the PROFILE the top plan tier gets — the
  # `advanced_models_enabled` entitlement selects the emitted
  # `orchestrator_advanced` role. Sonnet 5, not 4.6 (ADR-177): newer model
  # at $2/$10 vs $3/$15 — a strict upgrade within the same family.
  #
  # max_tokens 2048, not 1024: a multi-stop trip answer walks five sections
  # and was observed truncating mid-close at 1024. Single-city answers stay
  # short by prompt; the ceiling only needs to clear the long-answer shape.
  orchestrator:
    profile: haiku-fast
    advanced: sonnet-5
    max_tokens: 2048
    temperature: 0.7
    timeout_seconds: 60

  # Rewrites the user's taste_profile_summary from accumulated signals.
  # Triggered by debounced signal events and by chip_confirm.
  taste_regen:
    profile: mini-workhorse
    max_tokens: 512
    temperature: 0.3

  # Personal-fact extraction from a batch of recent user messages.
  # Triggered every Nth user turn (memory.extraction.debounce_messages).
  # Output feeds UserMemoryService.save_facts → user_memories.
  memory_extractor:
    profile: mini-workhorse
    max_tokens: 256
    temperature: 0

  # Resolves the working location at the start of every agent turn that
  # passes the location gate (core/agent/graph.py resolve_location node).
  # Classification-like structured output with nuanced rules (future tense,
  # shift-vs-continuation, GPS-vs-explicit-name precedence) that mini-tier
  # models measurably miss — the round-1 bakeoff confirmed Haiku's lead
  # (0.917 vs 0.833), so this stays on the realtime Claude profile.
  # Its 18KB rules head rides the prompt cache (ADR-174).
  location_resolver:
    profile: haiku-fast
    max_tokens: 512
    temperature: 0
    timeout_seconds: 20

  # Proposes well-known place names that fit the user's intent, scoped to
  # the turn's working location and movement capabilities. Output feeds
  # the `suggest_places` agent tool, which then validates each candidate
  # against the place provider. Cheap structured-output role — model
  # knowledge of local landmarks matters more than reasoning depth.
  candidate_namer:
    profile: mini-workhorse
    max_tokens: 700
    temperature: 0.3
    timeout_seconds: 20

  # Generates the home screen's context-aware greeting + suggestion chips
  # from the user's taste signal and the client-supplied local context
  # (location, local time, optional weather). Output feeds GET /v1/home and
  # is Redis-cached per coarse context bucket (ADR-111). Higher temperature
  # for greeting variety; cheap structured-output role.
  home_suggester:
    profile: mini-workhorse
    max_tokens: 300
    temperature: 0.8
    timeout_seconds: 15

# ---------------------------------------------------------------------------
# Extraction pipeline — confidence weights and decision thresholds
# ADR-018, ADR-034: confidence scoring and two-phase confirmation
# ---------------------------------------------------------------------------
extraction:
  # ADR-074: TTL for the URL-keyed result cache. 30 days — long
  # enough to capture viral spread of a shared post; short enough
  # that edited or deleted content washes out within a month.
  result_cache_ttl_seconds: 2592000  # 30 * 24 * 60 * 60
  confidence_weights:
    base_scores:
      CAPTION: 0.70
      PLAIN_TEXT: 0.70
      SPEECH: 0.60
      OCR: 0.55
    places_modifiers:
      EXACT: 0.20
      FUZZY: 0.15
      CATEGORY_ONLY: 0.10
      NONE_CAP: 0.30
    multi_source_bonus: 0.10
    max_score: 0.95
  thresholds:
    store_silently: 0.70
    require_confirmation: 0.30
  confidence:
    # Per-producer base scores. Keys are Producer.value strings.
    producer_scores:
      # Name producers
      llm_ner: 0.80
      # User-curated lists are explicit saves — treat them as ground truth.
      google_maps_list: 0.95
      # Instagram-tagged caption / location_tag — moderate signal.
      instagram_post: 0.65
      vision_frames: 0.55
      vision_images: 0.55
      # Text producers — modest baseline; corroboration bonus when paired
      # with a name producer is what actually lifts confidence.
      tiktok_caption: 0.65
      video_metadata: 0.60
      whisper_audio: 0.65
      subtitle_check: 0.75
      photo_detector: 0.50
    # Per-medium base scores. Keys are Medium.value strings.
    medium_scores:
      emoji_marker: 0.92
      location_tag: 0.85
      caption: 0.75
      title: 0.70
      transcript: 0.65
      supplementary_text: 0.70
      hashtag: 0.55
      frame: 0.55
      image: 0.55
      list: 0.95
    corroboration_bonus: 0.10
    max_score: 0.97
    # Confidence is no longer a write gate (ADR-071 — every picker
    # output is saved). `confident_threshold` now gates only the
    # ADR-081 shared-alias contribution: a source label enters the
    # global place_name_aliases only when the pick is at/above it.
    confident_threshold: 0.70
  circuit_breaker_threshold: 3
  circuit_breaker_cooldown: 900
  vision:
    # Listicle posts ("10 must-visit places") show one numbered card per
    # place; 14 covers a 10-item list plus intro/outro/duplicate scene
    # cuts. Dedup + the classifier discard near-duplicate frames.
    max_frames: 14
    # 0.2 (was 0.3): listicle cards cut between visually similar shots
    # (aerial temple → aerial temple); 0.3 missed most transitions and
    # sampled only ~5 of 10 cards.
    scene_threshold: 0.2
    # 25 (was 10): budget covers download + ffmpeg decode + one vision
    # call over up to `max_frames` images. Deep level runs async.
    timeout_seconds: 25
  whisper:
    timeout_seconds: 8
    audio_format: opus
    audio_quality: 32k
  subtitle:
    output_dir: /tmp/subtitles
    format: vtt
  # Place fields that can be updated on re-submission (upsert semantics)
  mutable_fields:
    - place_name
    - address
    - cuisine
    - price_range
    - lat
    - lng
    - source_url
    - validated_at
    - confidence
    - source

# ---------------------------------------------------------------------------
# External services — URLs and timeouts
# ---------------------------------------------------------------------------
external_services:
  tiktok_oembed:
    base_url: https://www.tiktok.com/oembed
    timeout_seconds: 3.0

# ---------------------------------------------------------------------------
# Embeddings configuration
# ADR-040: Voyage 4-lite chosen for 9.25% better retrieval quality
# ---------------------------------------------------------------------------
embeddings:
  dimensions: 1024
  description_separator: " | "
  description_fields:
    - place_name
    - subcategory
    - place_type
    - cuisine
    - ambiance
    - price_hint
    - tags
    - good_for
    - dietary
    - neighborhood
    - city
    - country
  # Voyage rate-limit circuit breaker (providers/embeddings.VoyageEmbedder).
  # The Voyage SDK's internal tenacity retry chain costs ~15s per call
  # on rate-limit. `hard_timeout_seconds` aborts individual calls before
  # the retry loop exhausts; `rate_limit_cooldown_seconds` skips
  # subsequent calls entirely while the breaker is tripped. Saves are
  # non-fatal on embedding failure (places persist; embeddings refill
  # on a later save or backfill).
  hard_timeout_seconds: 3.0
  rate_limit_cooldown_seconds: 60.0

# ---------------------------------------------------------------------------
# Prompt Templates (ADR-059)
# Logical name → file path relative to config/prompts/
# Code loads via get_config().prompts["name"], cached on first read.
# Migrate hardcoded prompts here incrementally.
# ---------------------------------------------------------------------------
prompts:
  taste_regen: taste_regen.txt
  agent: agent.txt
  place_resolver: place_resolver.txt
  place_classifier: place_classifier.txt
  place_profiler: place_profiler.txt
  area_profiler: area_profiler.txt
  area_registry: area_registry.txt
  location_resolver: location_resolver.txt
  candidate_namer: candidate_namer.txt
  home_suggester: home_suggester.txt
  knowledge_harvester: knowledge_harvester.txt
  knowledge_curator: knowledge_curator.txt
  knowledge_curator_anchor: knowledge_curator_anchor.txt
  web_harvester: web_harvester.txt

# ---------------------------------------------------------------------------
# Knowledge layer (ADR-120/121) — provenance-weighted confidence floors.
# A single harvested mention is weak evidence; curated expertise is strong.
# The writer floors each claim's model-estimated confidence by source trust.
# ---------------------------------------------------------------------------
knowledge:
  harvest_confidence_floor: 0.35
  curator_confidence_floor: 0.9
  # The saved-recommendation reason, written as a user-scoped `kebi_message`
  # claim on save (ADR-127) — floored between harvested and curated.
  kebi_message_confidence_floor: 0.8
  # Web-mined claims (ADR-145). The lowest floor in the set on purpose: a
  # search snippet is one unreviewed page, weaker evidence than something a
  # person cared enough to share. It still surfaces — the ranker weighs
  # trust, it does not gate on it — but it loses to a harvested or curated
  # claim that says otherwise.
  web_search_confidence_floor: 0.25
  web_search_review_status: approved
  # Review gate (ADR-122). The state a fresh claim from each source lands in.
  # Both `approved` today — the product trusts every writer. When review turns
  # on, set e.g. `harvest_review_status: pending` here (config, not code) and
  # a reviewer (AI or team) moves harvested claims to approved before they
  # surface. Allowed: pending | approved | rejected.
  harvest_review_status: approved
  curator_review_status: approved
  kebi_message_review_status: approved
  # Max insider notes surfaced on one place in the Library read (ADR-127).
  place_notes_limit: 6
  # Insider notes attached to place-tool results on the retrieval path so a
  # recommendation turn carries what kebi knows without spending a `research`
  # call (ADR-137). Per candidate, and per turn for the area pool.
  candidate_notes_limit: 2
  area_notes_limit: 3
  # Research read path — the knowledge layer's agent-facing reader.
  # `entity_confidence_min` is the resolve-vs-clarify threshold (exact
  # working-location match resolves at 1.0, verified geocode at 0.8; below
  # the min the tool asks instead of retrieving). The `w_*` weights shape the
  # in-memory relevance rank (controlled-vocabulary tag match, lexical text
  # overlap, writer trust, proximity to the asked scope) and
  # `topic_relevance_floor` is the `no_topic_match` cutoff on the relevance
  # component — only applied when the question carries topic signal.
  research:
    entity_confidence_min: 0.5
    w_tag: 0.5
    w_text: 0.3
    w_trust: 0.2
    w_prox: 0.1
    topic_relevance_floor: 0.05
  # Curation anchor-chip typeahead (/v1/knowledge/entities). Areas lead the
  # result list (few, exact-ish); the resolver cache remembers a verified or
  # missed geocode of an unseen area name so typeahead traffic can't hammer
  # the rate-limited public Nominatim instance.
  entity_search:
    area_limit: 3
    resolver_cache_ttl_seconds: 604800

# ---------------------------------------------------------------------------
# Agent Configuration (feature 027 M2, ADR-062)
# enabled is controlled by AGENT_ENABLED env var (EnvConfig), default true.
# max_steps / max_errors bound the graph's should_continue loop.
# checkpointer_ttl_seconds reserved for a future cleanup job (Postgres has
# no native TTL; periodic cleanup is deferred).
# ---------------------------------------------------------------------------
agent:
  max_steps: 10
  max_errors: 3
  # Per-turn ceiling on tool invocations. Must be <= max_steps. When hit,
  # the graph routes to fallback_node with a "give me more detail" message
  # rather than letting the agent keep firing tools speculatively.
  max_tool_calls: 5
  max_history_messages: 40
  # Older ToolMessage payloads (~2-5KB each) get replaced by a one-line
  # breadcrumb on the way to the LLM. The most recent `tool_result_window`
  # payloads stay full. State is untouched — this only rewrites the per-call
  # conversation list. 0 disables compaction. (Also relevant: tool results
  # are stripped from state entirely at the finalize node before checkpoint,
  # so this compaction only matters for in-turn rebuild from history.)
  tool_result_window: 2
  # Cap unbounded growth of state["messages"] in long-lived threads. When the
  # list exceeds `state_message_cap`, the reducer trims it down toward
  # `state_message_floor` at the next HumanMessage boundary (preserves
  # tool_use/tool_result pairing). Floor must be >= max_history_messages and
  # < cap. Trimmed messages are gone from the checkpointer blob — irrelevant
  # to the LLM (already past the 40-message window) but reduces per-checkpoint
  # blob size for chatty threads.
  state_message_cap: 200
  state_message_floor: 150
  checkpointer_ttl_seconds: 86400
  # ADR-067/100: Anthropic ephemeral cache_control on the orchestrator system
  # message. Enabled now the default orchestrator is Anthropic Haiku 4.5 — the
  # two same-turn Sonnet/Haiku calls (tool-decision + synthesis) render an
  # identical system prompt, so the second call reads the cache instead of
  # re-billing the full input. Haiku's min cacheable prompt (2048 tokens) is
  # well under the ~9k-token system prompt. Set false for non-Anthropic
  # orchestrators (AGENT_MODEL=gpt-4o-mini), which auto-cache server-side.
  prompt_caching_enabled: true
  # Per-tool asyncio budgets. One key per live tool.
  tool_timeouts_seconds:
    find_saved: 8
    # suggest_places fans out: 1 namer LLM call + up to `name_count` parallel
    # provider lookups (bounded by a semaphore inside the tool). The budget
    # covers both phases — pad over find_saved's pure-DB timeout.
    suggest_places: 18
    # research reads the claims store by indexed entity key (no LLM, no
    # provider); at most one free Nominatim geocode when the asked-about
    # area isn't the working location. Same budget as the pure-DB tools.
    research: 8
    find_known: 8
    # web_search is one outbound HTTP call (its own 6s budget) plus a Redis
    # cache lookup. Kept tight — a slow search must cost the answer its
    # freshness, never the turn.
    web_search: 10
  # find_saved-specific knobs. `default_limit` is what the tool uses when
  # the agent omits the `limit` arg. `max_limit` caps any agent-supplied
  # value so the LLM cannot ask for an unbounded result set.
  find_saved:
    default_limit: 10
    max_limit: 25
  # find_known — claims-driven retrieval (ADR-138). Two indexed reads, no
  # LLM and no provider, so it leads a recommendation turn. `scan_limit`
  # bounds the geofenced claims join; `notes_per_place` runs richer than the
  # passive attach limit because here the facts ARE the reason the place
  # surfaced.
  find_known:
    default_limit: 5
    max_limit: 15
    notes_per_place: 3
    scan_limit: 300
  # suggest_places — knobs for the candidate-naming + provider-validation
  # flow. `default_limit` / `max_limit` cap what the agent can ask back
  # (same role as in `find_saved`). `name_count` is how many candidate
  # names the namer LLM is asked to produce — kept higher than the typical
  # limit so the provider-validation and constraint-filter steps have
  # headroom to drop misses without going empty. `provider_concurrency`
  # bounds the per-tool fan-out into PlacesSearchService.find().
  suggest_places:
    default_limit: 5
    max_limit: 15
    name_count: 8
    provider_concurrency: 5
  # research — insider notes from the knowledge layer. `default_limit` /
  # `max_limit` cap the agent-supplied `limit`; `notes_limit` is the
  # service's own hard cap per call. Kept tight: the notes feed one prose
  # answer, not a list UI.
  research:
    default_limit: 6
    max_limit: 10
    notes_limit: 10
  # web_search — the outside world (ADR-145). Backed by Brave when
  # BRAVE_API_KEY is set, the null provider otherwise (tool stays callable,
  # returns empty, agent answers from what it knows).
  #
  # `snippet_max_chars` caps one finding at roughly a long sentence and a
  # half: enough to ground a date or a price, not enough to crowd out the
  # claims, which are the part of an answer that is ours.
  #
  # The tool fires whenever the agent judges the question needs the outside
  # world — no "only when the corpus is thin" gate — so `cache_ttl_seconds`
  # is what makes that affordable. One day: short enough that a schedule
  # change washes out by tomorrow, long enough that a question trending
  # across users is paid for once. Results are not user-scoped, so the cache
  # key is the question, shared by everyone.
  #
  # `harvest_enabled` gates the write-back into the claims store, so a bad
  # harvest is switched off by config rather than a deploy.
  web_search:
    default_limit: 5
    max_limit: 8
    snippet_max_chars: 320
    cache_ttl_seconds: 86400
    harvest_enabled: true
  # Multi-stop itinerary turns (ADR-148). `max_stops` caps how many
  # resolver-named stops get geocoded (one forward geocode each);
  # `per_segment_limit` is the per-stop / per-leg candidate cap the fan-out
  # tools use in place of their single-search limit — an itinerary answer
  # wants a few strong names per segment, not one city's worth from each.
  itinerary:
    max_stops: 5
    per_segment_limit: 4
    # Trip turns get their own tool budget: retrieval + per-stop suggestions
    # + the ADR-150 verification round don't fit the flat 5-call cap.
    max_tool_calls: 8

# ---------------------------------------------------------------------------
# Movement / search-scope (ADR-084)
# Every agent turn resolves an effective movement mode + scope tier into a
# concrete search radius: radius = radius_tiers[shift(tier, reach)] ×
# mode_multiplier[mode] × density_factor[density]. reach shifts the tier ±1
# (compact -1, far +1); density comes from the geocoder's place type so
# "near me" scales with how dense the area is.
# `fallback` is the mobility used when nobody has told kebi how this user
# gets around (ADR-086, reversed by ADR-156). It used to lead with walking,
# on the reasoning that the conservative guess was the safe one. It is not:
# narrowing when ignorant fails invisibly, because a driver capped at walking
# range never learns the places past it were dropped. Rideshare leads now —
# the one mode almost anyone has almost anywhere, assuming no licence, no
# vehicle and no fitness — so an unknown user is guessed wide and told so.
# ---------------------------------------------------------------------------
movement:
  radius_tiers:        # base metres per scope tier, before mode/reach scaling
    walkable: 1000
    neighborhood: 2500
    city: 7000
    metro: 45000
  mode_multiplier:     # per-mode scale applied to the tier base
    walking: 1.0
    cycling: 1.5
    transit: 2.0
    rideshare: 2.2
    motorbike: 2.4
    driving: 2.6
  density_factor:      # location-density scale (from the geocoder place type)
    dense: 0.7
    medium: 1.0
    sparse: 1.6
  # Ceiling on the resolved radius (ADR-143). The three factors above
  # multiply, and at the wide end that compounded past any useful search:
  # metro x motorbike x sparse resolved to 172.8 km, wider than Bali is long.
  # A corridor search may exceed this — that width is route geometry, not a
  # guess (see anchor_to_corridor).
  max_radius_m: 60000
  fallback:            # used whenever movement is unresolved, not just absent
    reach: normal
    available_modes: [rideshare, walking, transit]

# ---------------------------------------------------------------------------
# Taste Model Configuration
# Signal-counts aggregation + LLM-generated taste_profile_summary
# ADR-058: RankingService deleted, agent-driven ranking deferred
# ---------------------------------------------------------------------------
taste_model:
  debounce_window_seconds: 30
  regen:
    min_signals: 3
    early_signal_threshold: 10
  # Evidence weight per signal in taste aggregation (the conviction ladder).
  # A passive link-share `save` trains nothing on its own; a saved
  # recommendation carries a base weight; the Library pills `visited`/`liked`
  # add graduated bonuses on top, and `liked_negative` weights a disliked place
  # into the rejected branch. Ladder: visited+liked >> liked > saved_rec >
  # accepted. `approved` is a curation gate (not a weight).
  signal_weights:
    save: 0
    accepted: 1
    saved_recommendation: 2
    visited: 2
    liked: 3
    liked_negative: 3
    rejected: 1

# ---------------------------------------------------------------------------
# User Memory Configuration
# Personal fact extraction confidence thresholds
# ---------------------------------------------------------------------------
memory:
  confidence:
    stated: 0.9
    inferred: 0.6
  extraction:
    # Run extraction once every Nth user turn. Each turn appends to a
    # per-user Redis buffer; on the Nth append the buffer is drained and
    # passed to the memory_extractor LLM as one batch.
    debounce_messages: 5
    # TTL on the per-user message buffer (seconds). Refreshed on every
    # append, so active users never expire. Caps Redis memory leak from
    # users who go quiet mid-batch. 7 days.
    buffer_ttl_seconds: 604800

# ---------------------------------------------------------------------------
# Home screen — greeting + suggestion chips (ADR-111)
# Generated by the home_suggester role and Redis-cached per coarse context
# bucket. TTL is bounded so a greeting refreshes within the hour; the
# daypart segment of the cache key prevents a "good morning" leaking into
# the evening regardless of TTL.
# ---------------------------------------------------------------------------
home:
  cache_ttl_seconds: 3600
  # Number of suggestion chips the LLM is asked for. The generation schema
  # enforces these bounds; the fallback emits exactly chip_min generic chips.
  chip_min: 3
  chip_max: 4

# ---------------------------------------------------------------------------
# Area screen + profiler (ADR-153)
# An area's row is generated once, on its first open, by the area_profiler
# role — from the approved claims under its geo-key prefix plus the model's
# own geography knowledge.
# ---------------------------------------------------------------------------
areas:
  # Cap on approved claims fed into one profiling call (highest-confidence
  # first when it bites).
  claims_input_limit: 30
  # Cap on "worth knowing" child areas stored on the row.
  notable_sub_areas_max: 6

# ---------------------------------------------------------------------------
# User intents — the "what you wanted" recall list (ADR-110)
# Intent-bearing chat turns are persisted from the turn-completed event.
# The agent-signal gate (a turn actually surfaced places) is the primary
# filter; these knobs are the cheap belt-and-suspenders heuristic.
# ---------------------------------------------------------------------------
user_intents:
  # A turn's message must have at least this many words to be recalled —
  # filters terse confirmations the agent-signal gate might let through.
  min_words: 3
  # Pure confirmations / ordinals / pronoun-only replies never recalled,
  # even if they surfaced places (e.g. "yes" to a "want me to widen?" prompt).
  stoplist:
    - "yes"
    - "no"
    - "ok"
    - "okay"
    - "yeah"
    - "yep"
    - "nope"
    - "sure"
    - "the first one"
    - "the second one"
    - "the third one"
    - "that one"
    - "this one"
    - "first"
    - "second"
    - "third"
  # Skip a new intent when it duplicates the user's most recent one within
  # this window — avoids clutter from rapid re-asks of the same thing.
  dedup_window_seconds: 600

# ---------------------------------------------------------------------------
# Pricing Configuration (ADR-092)
# Reconcile monthly against invoices per docs/runbooks/cost-reconciliation.md.
# Each provider carries its own `verified_on` date so reconciliation can
# update one section without re-touching the others. Every section is read
# by code: `llm:` is keyed by MODEL NAME (exact, or a prefix of a
# date-suffixed model id) and prices the `cost_usd` stamped on LLM spans;
# Langfuse's catalog is the reconciliation cross-check (ADR-092).
# `embeddings:`, `transcription:`, and `external:` price providers
# Langfuse cannot.
# ---------------------------------------------------------------------------
pricing:
  currency: USD
  llm:
    # OpenAI — verified 2026-08-20 — source: developers.openai.com/api/docs
    gpt-4o:
      input_per_1m: 2.50
      cached_input_per_1m: 1.25
      output_per_1m: 10.00
    gpt-4o-mini:
      input_per_1m: 0.15
      cached_input_per_1m: 0.075
      output_per_1m: 0.60
    # Candidate (benchmark round 1) — GPT-5.6 family, GA 2026-07-09.
    gpt-5.6-luna:
      input_per_1m: 0.20
      cached_input_per_1m: 0.02
      output_per_1m: 1.20
    gpt-5.6-terra:
      input_per_1m: 2.00
      cached_input_per_1m: 0.20
      output_per_1m: 12.00
    # Anthropic — verified 2026-08-20 — source: platform.claude.com/docs/en/about-claude/pricing
    claude-sonnet-4-6:
      input_per_1m: 3.00
      cache_read_per_1m: 0.30
      cache_write_5m_per_1m: 3.75
      cache_write_1h_per_1m: 6.00
      output_per_1m: 15.00
    # Prefix of claude-haiku-4-5-20251001 — used by location_resolver and
    # as the default orchestrator (ADR-100).
    claude-haiku-4-5:
      input_per_1m: 1.00
      cache_read_per_1m: 0.10
      cache_write_5m_per_1m: 1.25
      cache_write_1h_per_1m: 2.00
      output_per_1m: 5.00
    # Candidate — Sonnet 5 ($2/$10 made standard; the announced Sep 2026
    # increase to $3/$15 was cancelled).
    claude-sonnet-5:
      input_per_1m: 2.00
      cache_read_per_1m: 0.20
      cache_write_5m_per_1m: 2.50
      cache_write_1h_per_1m: 4.00
      output_per_1m: 10.00
    # Candidates via OpenRouter (model ids are provider-prefixed there) —
    # verified 2026-08-20 — sources: openrouter.ai model pages.
    # Gemini 3.7 Flash is Google's intro rate through 2026-12-31; doubles
    # to 1.50/7.50 on 2027-01-01 (calendar note in the reconciliation doc).
    google/gemini-3.7-flash:
      input_per_1m: 0.75
      cached_input_per_1m: 0.075
      output_per_1m: 3.75
    qwen/qwen3.5-flash:
      input_per_1m: 0.065
      output_per_1m: 0.26
    qwen/qwen3.5-plus:
      input_per_1m: 0.40
      output_per_1m: 2.40
    # DeepSeek moved to peak/off-peak billing 2026-08-16 (peak doubles
    # these); rates below are off-peak — reconcile against the invoice.
    deepseek/deepseek-v4-flash:
      input_per_1m: 0.14
      output_per_1m: 0.28
    minimax/minimax-m3:
      input_per_1m: 0.60
      output_per_1m: 2.40
  embeddings:
    # Voyage — verified 2026-05-24 — source: docs.voyageai.com/docs/pricing
    voyage_4_lite:
      input_per_1m: 0.02
  transcription:
    # Groq — verified 2026-05-24 — source: groq.com/pricing
    # $0.04/hour audio (10s minimum per request). Per-second = 0.04 / 3600.
    whisper_large_v3_turbo:
      per_audio_second: 0.00001111
  external:
    google_places:
      # Google Places (New) — verified 2026-07-09 — source: developers.google.com/maps/billing-and-pricing/pricing
      # Google is a minimal location validator (ADR-118). Search masks pull
      # only id/displayName/address/location/types → Text Search Pro.
      # Place Details omits displayName (catalog name is authoritative)
      # → Place Details Essentials.
      per_endpoint:
        ":searchText": 0.032       # $32 / 1k — Text Search Pro
        ":searchNearby": 0.032     # $32 / 1k — Nearby Search Pro
        "/{place_id}": 0.005       # $5 / 1k  — Place Details Essentials
    google_geocoding:
      # Google Geocoding API — verified 2026-08-20 — source: developers.google.com/maps/billing-and-pricing/pricing
      # Registry minting only (geo identity, once per unique area ever —
      # forward lookups at mint plus split/group verification). Steady-state
      # volume is near zero: resolution is an alias lookup, not a call.
      # First 10k requests/month are free (Essentials SKU) — mint volume
      # should never leave the free tier; the price is the over-tier rate.
      per_request: 0.005           # $5 / 1k — Geocoding (after 10k/mo free)
    apify:
      # Apify — verified 2026-05-24 — sources: actor pages on apify.com
      # Per-result × x-apify-pagination-total header — no follow-up call.
      google_maps_list:
        per_result: 0.013          # parseforge/google-maps-shared-list-scraper: $13/1k (paid plan)
      instagram_post:
        per_result: 0.0027         # apify/instagram-post-scraper: $2.70/1k (Free tier)
